name: J.A.R.V.I.S.
slug: jarvis
description: Lokaler Hermes-Chat mit Desktop-Textmodus, TTS und optionalem Voice Mode.
version: "0.1.4"
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
ingress_stream: true
panel_title: J.A.R.V.I.S.
panel_icon: mdi:robot-outline
panel_admin: false
arch:
  - amd64
  - aarch64
ports:
  8787/tcp: 8787
ports_description:
  8787/tcp: J.A.R.V.I.S. Weboberfläche
webui: http://[HOST]:[PORT:8787]
map:
  - data:rw
options:
  hermes_base_url: ""
  hermes_api_key: ""
  access_password: ""
  whisper_cpp_path: ""
  whisper_model_path: ""
  ffmpeg_path: /usr/bin/ffmpeg
schema:
  hermes_base_url: str
  hermes_api_key: password
  access_password: password
  whisper_cpp_path: str
  whisper_model_path: str
  ffmpeg_path: str
